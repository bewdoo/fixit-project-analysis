<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fixit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--soft:#FAFAFA;--panel:#FFFFFF;--ink:#18181B;--muted:#62626B;--faint:#A1A1AA;
  --line:#ECECEE;--line2:#E4E4E7;--fill:#F1F2F4;--fill2:#E4E6EA;--bar:#3F3F46;
  --green:#16A34A;--green-soft:#ECFDF3;--amber:#D97706;--amber-soft:#FEF3E2;
  --violet:#7C3AED;--violet-soft:#F3EEFE;--blue:#2563EB;--blue-soft:#EBF1FE;
  --red:#DC2626;--red-soft:#FEECEC;--radius:16px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;flex:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{appearance:none;border:0;background:none;font-size:14px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.13s}
.tab-btn:hover:not(:disabled){color:var(--ink);background:var(--fill)}
.tab-btn.active{color:var(--ink);background:var(--fill2)}
.tab-btn:disabled{opacity:.35;cursor:default}
.upbtn{appearance:none;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;flex:none}
.upbtn:hover{background:var(--fill)}
@media(max-width:820px){.topbar-in{flex-wrap:wrap;gap:8px 14px;padding-block:10px}.tabs{order:3;flex-basis:100%}}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 90px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phead{margin:0 2px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.phead p{margin-top:6px;color:var(--muted);font-size:15px;max-width:640px}
.sh{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:36px 2px 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0;box-shadow:0 1px 2px rgba(24,24,27,.04)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.small{font-size:13px;color:var(--muted)}
.label{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

/* big answer */
.answer{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:26px 28px}
.answer .kicker{font-size:13px;color:var(--muted)}
.answer h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.12;margin-top:4px}
.answer .say{font-size:17px;line-height:1.55;margin-top:14px;max-width:62ch}
.answer .say b{font-weight:700}
.score{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:150px}
.score .sl{font-size:14px;font-weight:700}
.score .ss{font-size:12px;color:var(--faint)}

/* key numbers */
.nums{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:14px}
.num{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.num:first-child{border-left:0}
.num .nl{font-size:13px;color:var(--muted);font-weight:500}
.num .nv{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.num .nv.t{font-family:var(--sans);font-weight:800;font-size:24px}
.num .ns{font-size:13px;color:var(--faint);margin-top:2px}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.list li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;line-height:1.5}
.list li span{color:var(--muted)}
.list li b{color:var(--ink);font-weight:600}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans)}
.mk.y{background:var(--green-soft);color:var(--green)}
.mk.n{background:var(--red-soft);color:var(--red)}
.mk.c{background:var(--amber-soft);color:var(--amber)}
.colhead{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:16px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.r{background:var(--red-soft);color:var(--red)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.badge.n{background:var(--fill);color:var(--muted)}

/* check cards */
.check{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--amber)}
.check h3{font-size:16px;font-weight:700}
.check p{font-size:14px;color:var(--muted)}
.check .ask{font-size:14px;font-weight:600;color:var(--ink);background:var(--fill);border-radius:10px;padding:9px 12px;margin-top:4px}

/* qa cards (investment) */
.qa{display:flex;flex-direction:column;gap:12px}
.qa .qh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qa h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.qa p{font-size:15px;color:var(--muted)}
.qa p b{color:var(--ink)}

/* bars */
.pbar{display:grid;grid-template-columns:190px 1fr 74px;gap:12px;align-items:center;padding:6px 0}
.pbar .bl{font-size:14px}
.pbar .bv{font:600 13px var(--mono);text-align:right}
.btrack{height:14px;background:var(--fill);border-radius:7px;overflow:hidden}
.bfill{height:100%;background:var(--fill2);border-radius:7px;background:#A1A1AA}
.pbar.you .bl{font-weight:700}
.pbar.you .bfill{background:var(--blue)}
.pbar.you .bv{color:var(--blue)}

/* fit check */
.fitwrap{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.qs{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:10px}
.q .ql{font-size:15px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{appearance:none;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--faint)}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.money{display:flex;align-items:center;gap:8px;max-width:260px}
.money input{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%;font-family:var(--mono);font-size:15px;background:var(--panel)}
.money span{font-size:14px;color:var(--muted);white-space:nowrap}
.fitside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gauge .v{font-weight:800;font-size:20px;letter-spacing:-.01em}

/* cost */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan>div{padding:16px 18px;border-left:1px solid var(--line)}
.plan>div:first-child{border-left:0}
.plan .pv{font:600 21px var(--mono);margin-top:4px}
.plan .pp{font-size:13px;color:var(--muted)}
.plan .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.inputs{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.inp{display:flex;flex-direction:column;gap:5px}
.inp label{font-size:13px;color:var(--muted);font-weight:500}
.inp input{border:1px solid var(--line2);border-radius:10px;padding:8px 11px;width:120px;font-family:var(--mono);font-size:14px}

/* facts */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fact{padding:16px 18px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fact:nth-child(3n+1){border-left:0}
.fact:nth-child(-n+3){border-top:0}
.fact .fv{font-size:16px;font-weight:600;margin-top:4px}
.fact .fn{font-size:12.5px;color:var(--amber);margin-top:2px;font-weight:500}
.dist{display:grid;grid-template-columns:1fr auto auto;gap:10px 16px;align-items:center;font-size:15px}
.dist .dt{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:right}
.amen{display:flex;flex-wrap:wrap;gap:8px}
.amen span{background:var(--fill);border-radius:999px;padding:7px 13px;font-size:14px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:0 12px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--ink);font-weight:600}

/* upload */
.upgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .dico{width:48px;height:48px;border-radius:14px;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.drop h3{font-size:18px;font-weight:700}
.drop p{font-size:14px;color:var(--muted);max-width:40ch}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--fill)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{background:#000}
.cover{border-radius:10px;background:linear-gradient(160deg,#1B2A41,#0E1726);color:#E9D8B4;padding:14px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;max-width:100%}
.cover .c1{font:600 8.5px var(--mono);letter-spacing:.2em;opacity:.7}
.cover .c2{font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1.2;color:#F4E7CB}
.cover .c3{font-size:9px;letter-spacing:.08em;opacity:.8}
.samplecard{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px;transition:.15s;width:100%}
.samplecard:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(37,99,235,.08)}
.steps{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:center}
.stp:first-child{border-top:0}
.stp .n{width:24px;height:24px;border-radius:50%;background:var(--fill2);color:var(--muted);display:grid;place-items:center;font:700 11px var(--sans)}
.stp .t{font-size:14.5px;font-weight:500;color:var(--faint)}
.stp.active .n{background:var(--blue);color:#fff;animation:pulse 1s ease infinite}
.stp.active .t,.stp.done .t{color:var(--ink)}
.stp.done .n{background:var(--green);color:#fff}
@keyframes pulse{50%{opacity:.5}}
.prog{height:5px;background:var(--fill);border-radius:3px;overflow:hidden;margin:14px 0 8px}
.prog div{height:100%;background:var(--blue);width:0;transition:width .4s ease}
.filecard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.filecard .fi{width:36px;height:44px;border-radius:6px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:700 9.5px var(--mono);flex:none}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-top:36px}
.cta h3{font-size:18px;font-weight:700}
.cta p{font-size:14px;opacity:.7;margin-top:2px}
.cta .btn{background:#fff;color:var(--ink);border-color:#fff}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);line-height:1.6}
.tip{position:fixed;z-index:100;pointer-events:none;background:#18181B;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18)}

@media(max-width:900px){.fitwrap{grid-template-columns:1fr}.fitside{position:static}.grid4{grid-template-columns:1fr 1fr}.nums{grid-template-columns:1fr 1fr}.num:nth-child(3){border-left:0}.num:nth-child(n+3){border-top:1px solid var(--line)}}
@media(max-width:700px){
  .grid2,.grid3,.upgrid{grid-template-columns:1fr}
  .answer{grid-template-columns:1fr;padding:20px}.answer h1{font-size:25px}.answer .say{font-size:16px}
  .facts{grid-template-columns:1fr 1fr}.fact{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)!important}.fact:nth-child(odd){border-left:0!important}.fact:nth-child(-n+2){border-top:0!important}
  .pbar{grid-template-columns:120px 1fr 60px}.plan{grid-template-columns:1fr}.plan>div{border-left:0;border-top:1px solid var(--line)}.plan>div:first-child{border-top:0}
}
@media(max-width:440px){.nums,.grid4,.facts{grid-template-columns:1fr}.num{border-left:0!important;border-top:1px solid var(--line)}.num:first-child{border-top:0}.fact{border-left:0!important;border-top:1px solid var(--line)!important}.fact:first-child{border-top:0!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span>Fixit</div>
    <nav class="tabs" id="tabs" aria-label="Report sections"></nav>
    <button class="upbtn" id="upBtn">New brochure</button>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="tip" id="tip" hidden></div>

<script>
/* ============================ DATA ============================ */
const TODAY=new Date();
const CONFIGS={"3BHK":{super:2900,rent:180000,label:"3 BHK",size:"~2,900 sq ft"},"4BHK":{super:4328,rent:260000,label:"4 BHK",size:"~4,330 sq ft"}};
const S={cfg:"3BHK",super:2900,bsp:24000,other:12,gst:5,stamp:7,slab1:30,slab2:40,slab3:30,rate:8.6,tenure:20,rtm:15000,newLaunch:18000,rent:180000,possession:"2030-12-01"};
const F={purpose:"live",house:"4",parents:"no",own:"own",nri:"no",move:"flex",income:"300",budget:"10"};

/* ============================ HELPERS ============================ */
const $=s=>document.querySelector(s);
function cr(v){if(Math.abs(v)>=1e7)return"₹"+(v/1e7).toFixed(2)+" Cr";if(Math.abs(v)>=1e5)return"₹"+(v/1e5).toFixed(1)+" L";return"₹"+Math.round(v).toLocaleString("en-IN")}
const inr=v=>"₹"+Math.round(v).toLocaleString("en-IN");
const k=v=>"₹"+(v/1000).toFixed(0)+"k";
const mb=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
const pmt=(r,n,pv)=>r===0?pv/n:pv*r/(1-Math.pow(1+r,-n));
const badge=(t,c)=>`<span class="badge ${c}">${t}</span>`;
const IC={up:'<path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/>'};
const ic=k=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

function compute(){
  const base=S.super*S.bsp,other=base*S.other/100,gst=(base+other)*S.gst/100,stamp=(base+other)*S.stamp/100,total=base+other+gst+stamp;
  const loan=base*.75,emi=pmt(S.rate/1200,S.tenure*12,loan);
  const preKeys=S.slab1+S.slab2,toPoss=Math.max(0,mb(TODAY,new Date(S.possession)));
  const yieldPct=S.rent*12/total*100;
  return{base,other,gst,stamp,total,loan,emi,own:total-loan,incomeNeeded:emi*12/.4,preKeys,toPoss,yieldPct,
    overReady:Math.round((S.bsp/S.rtm-1)*100),overNew:Math.round((S.bsp/S.newLaunch-1)*100)};
}

/* ============================ SHELL ============================ */
const TABS=[["summary","Summary"],["fit","Is it for me?"],["cost","Cost"],["invest","Investment"],["details","Project details"]];
let analysed=false,cur="upload",srcName="";
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab-btn${cur===t[0]?" active":""}" data-t="${t[0]}"${analysed?"":" disabled"}>${t[1]}</button>`).join("");
  document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t){cur=t;renderTabs();render();window.scrollTo({top:0})}
function render(){
  const m=$("#main");
  if(cur==="upload"){m.innerHTML=vUpload();bindUpload();return}
  const c=compute();
  const V={summary:vSummary,fit:vFit,cost:vCost,invest:vInvest,details:vDetails};
  m.innerHTML=`<div class="view">${V[cur](c)}${foot()}</div>`;
  bind(c);
}
const foot=()=>`<div class="foot">Based on <b>${srcName}</b>, the project's government (RERA) registrations and public property listings. Prices and dates from third-party sites can be out of date. Always confirm with the builder, in writing, before you book.</div>`;
const nextBtn=(t,to)=>`<div class="cta"><div><h3>${t[0]}</h3><p>${t[1]}</p></div><button class="btn" data-go="${to}">${t[2]} →</button></div>`;

/* ============================ UPLOAD ============================ */
const STEPS=["Reading the brochure","Checking facts against government records","Working out the real price","Checking if it's a good investment","Preparing your report"];
function vUpload(){
  return `<div class="view"><div class="phead"><div><h1>Is this project right for you?</h1><p>Upload a property brochure. Fixit reads it, checks the facts, works out what you'll really pay, and gives you a straight answer.</p></div></div>
  <div class="upgrid">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel"><label class="drop" id="drop" for="file">
        <span class="dico">${ic("up")}</span>
        <h3>Drop the brochure here</h3>
        <p>A PDF, photo or Word file of any project brochure.</p>
        <span class="btn dark">Choose file</span>
        <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.ppt,.pptx" hidden>
      </label></div>
      <button class="samplecard" type="button" id="sampleBtn">
        <div class="cover" aria-hidden="true"><span class="c1">SECTOR 103 · GURUGRAM</span><span class="c2">THE WESTIN<br>RESIDENCES</span><span class="c3">3 &amp; 4 BHK</span></div>

let timer=null;
function bindUpload(){
  const drop=$("#drop"),file=$("#file");
  file.onchange=()=>{if(file.files[0])run(file.files[0])};
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)run(f)});
  $("#sampleBtn").onclick=ev=>{ev.preventDefault();run({name:"Westin_Residences_Brochure.pdf",size:6.8e6})};
}
function run(f){
  srcName=f.name.replace(/[<>&]/g,"");
  const ext=(f.name.split(".").pop()||"doc").toUpperCase().slice(0,4);
  $("#fileSlot").innerHTML=`<div class="filecard"><span class="fi">${ext}</span><div style="min-width:0"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${srcName}</div><div class="small">${f.size?(f.size/1e6).toFixed(1)+" MB · ":""}analysing…</div></div></div>`;
  clearTimeout(timer);let i=0;
  const step=()=>{
    $("#prog").style.width=(i/STEPS.length*100)+"%";
    if(i>0){const d=$("#ps"+(i-1));d.classList.remove("active");d.classList.add("done");d.querySelector(".n").textContent="✓"}
    if(i>=STEPS.length){timer=setTimeout(()=>{analysed=true;go("summary")},450);return}
    $("#ps"+i).classList.add("active");i++;timer=setTimeout(step,1300);
  };
  step();
}

function breakdown(c){
  const steps=[["Flat price",0,c.base,"var(--bar)"],["Parking, club & other charges",c.base,c.other,"var(--amber)"],["GST",c.base+c.other,c.gst,"var(--amber)"],["Stamp duty",c.base+c.other+c.gst,c.stamp,"var(--amber)"],["What you pay",0,c.total,"var(--blue)"]];
  const W=620,H=240,L=8,R=8,T=28,B=40,max=c.total*1.06,bw=(W-L-R)/steps.length,Y=v=>T+(H-T-B)*(1-v/max);
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line2)"/>`;
  steps.forEach((s,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,y0=Y(s[1]+s[2]),y1=Y(s[1]);
    g+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(2,y1-y0)}" rx="5" fill="${s[3]}"/>`;
    g+=`<text x="${x+w/2}" y="${y0-8}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">${i&&i<4?"+":""}${cr(s[2])}</text>`;
    const words=s[0].split(" ");const l1=words.length>2?words.slice(0,2).join(" "):s[0],l2=words.length>2?words.slice(2).join(" "):"";
    g+=`<text x="${x+w/2}" y="${H-22}" text-anchor="middle" font-size="12" fill="var(--muted)">${l1}</text>`+(l2?`<text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="12" fill="var(--muted)">${l2}</text>`:"")});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="How the price adds up">${g}</svg></div>`;
}
