<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fixit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--panel:#FFFFFF;--ink:#18181B;--muted:#71717A;--faint:#A1A1AA;
  --line:#ECECEE;--line2:#E4E4E7;--fill:#EEF0F2;--fill2:#E2E5E9;--bar:#3F3F46;
  --green:#16A34A;--green-soft:#ECFDF3;--amber:#D97706;--amber-soft:#FEF3E2;
  --violet:#7C3AED;--violet-soft:#F3EEFE;--blue:#2563EB;--blue-soft:#EBF1FE;
  --red:#DC2626;--red-soft:#FEECEC;--topbar:rgba(255,255,255,.9);
  --cta:#18181B;--cta-ink:#FFFFFF;--radius:16px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--topbar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em;flex:none}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.brand small{font-weight:500;color:var(--faint);font-size:11.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{appearance:none;border:0;background:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 13px;border-radius:9px;cursor:pointer;letter-spacing:-.01em;white-space:nowrap;transition:.13s}
.tab-btn:hover:not(:disabled){color:var(--ink);background:var(--fill)}
.tab-btn.active{color:var(--ink);background:var(--fill2)}
.tab-btn:disabled{opacity:.4;cursor:default}
.topbar-meta{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
.upbtn{appearance:none;border:0;background:var(--cta);color:var(--cta-ink);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;flex:none}
@media(max-width:860px){.topbar-in{flex-wrap:wrap;gap:8px 14px;padding-block:10px}.tabs{order:3;flex-basis:100%}.topbar-meta{display:none}}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:26px 90px}
.view{display:none;animation:fade .28s ease}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.phead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:2px 2px 16px}
.phead h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.phead p{margin-top:5px;color:var(--muted);font-size:13px;max-width:760px}
.shead{display:flex;align-items:center;gap:9px;margin:30px 2px 14px}
.shead h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.shead .ic{width:17px;height:17px;color:var(--muted);flex:none}
.shead .rule{flex:1;height:1px;background:var(--line);min-width:20px}
.shead .tag{font-size:11.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
@media(max-width:600px){.shead{flex-wrap:wrap}.shead .rule{display:none}.shead h2{white-space:normal}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.subhead{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 11px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{padding:15px 17px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.kpi .val{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val.txt{font-family:var(--sans);font-weight:700;font-size:20px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi select{border:1px solid var(--line2);border-radius:7px;background:var(--fill);padding:2px 5px;font-size:11px;max-width:100%}

/* verdict cards */
.vcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.vcard{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:14px;padding:15px 16px;display:flex;flex-direction:column}
.vcard .vk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;justify-content:space-between;gap:7px}
.vcard h3{font-size:14.5px;font-weight:700;margin:8px 0 5px;letter-spacing:-.01em}
.vcard p{font-size:12.5px;color:var(--muted);flex:1}
.vcard .mv{margin-top:10px;font-size:12px;font-weight:600;padding-top:9px;border-top:1px solid var(--line)}
.vcard.red{border-left-color:var(--red)}.vcard.red .vk,.vcard.red .mv{color:var(--red)}
.vcard.green{border-left-color:var(--green)}.vcard.green .vk,.vcard.green .mv{color:var(--green)}
.vcard.amber{border-left-color:var(--amber)}.vcard.amber .vk,.vcard.amber .mv{color:var(--amber)}
.vcard.muted{border-left-color:var(--faint)}.vcard.muted .vk,.vcard.muted .mv{color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:var(--fill);white-space:nowrap}
.chip.g{color:var(--green);background:var(--green-soft);border-color:transparent}
.chip.r{color:var(--red);background:var(--red-soft);border-color:transparent}
.chip.a{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.chip.b{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.chip.v{color:var(--violet);background:var(--violet-soft);border-color:transparent}

/* lists */
.fitlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.fitlist li{display:grid;grid-template-columns:18px 1fr;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.5}
.fitlist li b{color:var(--ink);font-weight:600}
.mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--mono);margin-top:1px}
.mk.y{background:var(--green-soft);color:var(--green)}
.mk.n{background:var(--red-soft);color:var(--red)}
.mk.c{background:var(--amber-soft);color:var(--amber)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:200px 1fr 56px;align-items:center;gap:11px}
.brow .bl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bl b{font-weight:600}
.btrack{height:9px;background:var(--fill);border-radius:5px;overflow:hidden}
.bfill{height:100%;background:var(--bar);border-radius:5px}
.bfill.g{background:var(--green)}.bfill.a{background:var(--amber)}.bfill.r{background:var(--red)}.bfill.b{background:var(--blue)}
.brow .bv{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
@media(max-width:760px){.brow{grid-template-columns:120px 1fr 48px}}

/* notes + cta */
.note{display:flex;gap:10px;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink);margin-top:14px;line-height:1.55}
.note.warn{background:var(--amber-soft)}
.note .ni{flex:none;width:16px;height:16px;color:var(--muted);margin-top:2px}
.note.warn .ni{color:var(--amber)}
.cta{display:flex;gap:11px;background:var(--cta);color:var(--cta-ink);border-radius:13px;padding:14px 16px;margin-top:14px;font-size:12.5px;line-height:1.55}
.cta .ci{flex:none;width:17px;height:17px;margin-top:1px;opacity:.85}
.cta .lead{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.08em;display:block;margin-bottom:4px;opacity:.7}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:0 12px 9px;border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .t-title{font-weight:600;color:var(--ink)}
.tbl .t-sub{color:var(--faint);font-size:11px;display:block;margin-top:1px}
.tbl tr.hl td{background:var(--blue-soft)}
.tbl tr.x td{opacity:.55}
.tbl tr.tot td{font-weight:700;color:var(--ink);background:var(--fill)}
.tbl td.ink{color:var(--ink)}

/* play cards */
.plays{display:flex;flex-direction:column;gap:11px}
.play{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:14px;padding:15px 17px}
.play .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play .pt{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.play .pcode{font-family:var(--mono);font-size:11px;color:var(--faint)}
.play .why{margin-top:8px;font-size:12.5px;color:var(--muted)}
.play .say{margin-top:10px;font-size:13px;font-weight:600;color:var(--ink);padding-left:11px;border-left:2px solid var(--line2)}
.play.red{border-left-color:var(--red)}.play.green{border-left-color:var(--green)}.play.blue{border-left-color:var(--blue)}.play.violet{border-left-color:var(--violet)}.play.amber{border-left-color:var(--amber)}.play.muted{border-left-color:var(--faint)}

/* upload */
.upgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:38px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .dico{width:44px;height:44px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.drop h3{font-size:16px;font-weight:700}
.drop p{font-size:12.5px;color:var(--muted);max-width:44ch}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn:hover{background:var(--fill)}
.btn.dark{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.xlink{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:0;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.stp:first-child{border-top:0;padding-top:0}
.stp .n{width:20px;height:20px;border-radius:50%;background:var(--fill2);color:var(--muted);display:grid;place-items:center;font:700 10px var(--mono)}
.stp .t{font-size:13px;font-weight:600}
.stp .d{font:11.5px/1.5 var(--mono);color:var(--faint);margin-top:2px;min-height:17px}
.stp .o{font:600 10.5px var(--mono);color:var(--faint);white-space:nowrap;padding-top:2px}
.stp.active .n{background:var(--blue);color:#fff;animation:pulse 1s ease infinite}
.stp.done .n{background:var(--green);color:#fff}
.stp.done .o{color:var(--green)}
@keyframes pulse{50%{opacity:.5}}
.prog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:4px 0 16px}
.prog div{height:100%;background:var(--blue);width:0;transition:width .4s ease}

/* forms */
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.fld select,.fld input{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--bg);width:100%;font-size:13px}
.fld input.in{background:var(--amber-soft);border-color:transparent;font-family:var(--mono)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gauge .v{font-weight:700;font-size:14px}
.slab{display:flex;height:30px;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.slab div{display:flex;align-items:center;justify-content:center;font:600 10.5px var(--mono);color:#fff;min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 14px;font-size:12.5px}
.kv dt{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;color:var(--ink)}
.timeline svg{display:block;width:100%;min-width:640px;height:auto}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.6}
.foot b{color:var(--muted);font-weight:600}

@media(max-width:1000px){.vcards,.grid4{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:760px){
  .grid2,.grid3,.upgrid{grid-template-columns:1fr}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,1fr)}
  .kpi{border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .kpi:nth-child(odd){border-left:0}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(4){border-left:1px solid var(--line)}
  .fitgrid{grid-template-columns:1fr!important}
}
@media(max-width:480px){.vcards,.grid4,.form{grid-template-columns:1fr}.kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:8px}}
/* ---- v4 polish ---- */
:root{--soft:#FAFAFA}
.panel{box-shadow:0 1px 2px rgba(24,24,27,.04)}
.phead h1{font-size:24px}
.crumb{font:500 11px var(--mono);color:var(--faint);letter-spacing:.02em}
.tip{position:fixed;z-index:100;pointer-events:none;background:#18181B;color:#fff;font-size:11.5px;padding:7px 9px;border-radius:8px;max-width:260px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tip b{font-weight:700}
.hero{display:grid;grid-template-columns:1fr 310px;padding:0;overflow:hidden;margin-bottom:14px}
.hero .hl{padding:24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero .hr{padding:22px 24px;border-left:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hero .loc{color:var(--muted);font-size:13px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px}
.hero .verdict{font-size:14px;line-height:1.6;color:var(--muted);max-width:66ch}
.hero .verdict b{color:var(--ink)}
.ring{display:flex;align-items:center;gap:14px}
.ring .rt b{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.ring .rt span{font-size:12px;color:var(--muted)}
.subbars{display:flex;flex-direction:column;gap:9px}
.subbars .brow{grid-template-columns:96px 1fr 34px}
.chart-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.chart-h .ct{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.chart-h .cs{font-size:12px;color:var(--muted);margin-top:2px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans)}
.pbar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;padding:5px 0;cursor:default}
.pbar .bl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .bv{font:600 12px var(--mono);text-align:right}
.pbar .btrack{height:12px;border-radius:6px}
.pbar.you .bl{font-weight:700}
.pbar.you .bfill{background:var(--blue)}
.pbar.you .bv{color:var(--blue)}
.pbar .bfill{border-radius:6px}
.meter{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.meter .ml{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.meter .ml b{font-family:var(--mono);color:var(--ink)}
.meter .mt{position:relative;height:7px;background:var(--fill);border-radius:4px}
.meter .mf{height:100%;border-radius:4px}
.meter .mf.r{background:var(--red)}.meter .mf.g{background:var(--green)}
.meter .mt i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.meter .ms{font:10.5px var(--mono);color:var(--faint)}
.q{display:flex;flex-direction:column;gap:8px}
.q .ql{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{appearance:none;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--faint)}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}
.fitwrap{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.fitside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:14px}
.persona{display:flex;flex-direction:column;gap:14px}
.persona .ph2{display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.persona .quote{font-size:14px;font-weight:600;padding-left:11px;border-left:2px solid var(--line2)}
.cover{border-radius:12px;background:linear-gradient(160deg,#1B2A41,#0E1726);color:#E9D8B4;padding:18px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;max-width:100%;font-family:var(--sans)}
.cover .c1{font:600 9px var(--mono);letter-spacing:.2em;opacity:.7}
.cover .c2{font-size:17px;font-weight:700;letter-spacing:.06em;line-height:1.2;color:#F4E7CB}
.cover .c3{font-size:10px;letter-spacing:.08em;opacity:.8}
.samplecard{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px;transition:.15s;width:100%}
.samplecard:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(37,99,235,.08)}
.filecard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin-bottom:14px}
.filecard .fi{width:36px;height:44px;border-radius:6px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:700 9.5px var(--mono);flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 16px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .ei{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--faint)}
.stp.idle .t{color:var(--faint)}
@media(max-width:960px){.hero{grid-template-columns:1fr}.hero .hr{border-left:0;border-top:1px solid var(--line)}.fitwrap{grid-template-columns:1fr}.fitside{position:static}}
@media(max-width:600px){.qgrid{grid-template-columns:1fr}.pbar{grid-template-columns:110px 1fr 58px}.hero h1{font-size:23px}.hero .hl,.hero .hr{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span>Fixit <small>Project Analysis</small></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard sections"></nav>
    <span class="topbar-meta" id="meta">No document</span>
    <button class="upbtn" id="upBtn">Upload brochure</button>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="tip" id="tip" hidden></div>

<script>
/* ============================ DATA ============================ */
const TODAY=new Date();
const P={
  name:"The Westin Residences",short:"Westin Residences",loc:"Sector 103, Dwarka Expressway, Gurugram",
  dev:"Whiteland Corporation Pvt. Ltd.",brand:"Westin · Marriott International",
  rera:["RC/REP/HARERA/GGM/838/570/2024/65","RC/REP/HARERA/GGM/839/571/2024/66","RC/REP/HARERA/GGM/840/572/2024/67","RC/REP/HARERA/GGM/949/681/2025/52"],
  launch:"2024-06-18",
  poss:[{v:"2028-12-01",l:"Dec 2028 · channel site"},{v:"2030-12-01",l:"Dec 2030 · listing"},{v:"2031-09-01",l:"Sep 2031 · listing"}]
};
const CONFIGS={"3BHK":{super:2900,rent:180000},"4BHK":{super:4328,rent:260000}};
const S={cfg:"3BHK",super:2900,bsp:24000,other:12,gst:5,stamp:7,slab1:30,slab2:40,slab3:30,rate:8.6,tenure:20,rtm:15000,newLaunch:18000,rent:180000,possession:"2030-12-01"};
const F={purpose:"live",house:"4",parents:"no",own:"own",nri:"no",move:"flex",income:"300",budget:"10"};

/* ============================ HELPERS ============================ */
const $=s=>document.querySelector(s);
function cr(v){if(Math.abs(v)>=1e7)return"₹"+(v/1e7).toFixed(2)+" Cr";if(Math.abs(v)>=1e5)return"₹"+(v/1e5).toFixed(1)+" L";return"₹"+Math.round(v).toLocaleString("en-IN")}
const inr=v=>"₹"+Math.round(v).toLocaleString("en-IN");
const mb=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()-a.getDate())/30.4;
const pmt=(r,n,pv)=>r===0?pv/n:pv*r/(1-Math.pow(1+r,-n));
const VC={PASS:"g",FAIL:"r",CONDITIONAL:"a",PARTIAL:"a",UNTESTED:"",VERIFY:"v",CONFLICT:"r",MINOR:"a",NOW:"b",EXCLUDED:"r",HELD:"a",CORRECTED:"r"};
const chip=(t,k)=>`<span class="chip ${k!==undefined?k:(VC[t]??"")}">${t}</span>`;
const SRC={B:["Brochure","v"],C:["Computed","b"],R:["Researched",""],D:["Directional","a"],V:["Verify","r"]};
const src=k=>chip(SRC[k][0],SRC[k][1]);
const IC={
  flag:'<path d="M4 21V4m0 0h11l-2 4 2 4H4"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',alert:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rupee:'<path d="M6 4h12M6 9h12M9 4c5 0 5 10 0 10H6l8 7"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-4-5.5"/>',pin:'<path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  up:'<path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/>'
};
const ic=(k,c="ic")=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const shead=(i,t,tag)=>`<div class="shead">${ic(i)}<h2>${t}</h2><span class="rule"></span>${tag?`<span class="tag">${tag}</span>`:""}</div>`;
const phead=(t,d,right)=>`<div class="phead"><div><h1>${t}</h1>${d?`<p>${d}</p>`:""}</div>${right||""}</div>`;
const note=(t,warn)=>`<div class="note${warn?" warn":""}">${ic(warn?"alert":"bulb","ni")}<div>${t}</div></div>`;

/* ============================ COMPUTE ============================ */
function compute(){
  const base=S.super*S.bsp,other=base*S.other/100,sub=base+other,gst=sub*S.gst/100,stamp=sub*S.stamp/100,allin=sub+gst+stamp;
  const preHand=S.slab1+S.slab2,loan=base*.75,emi=pmt(S.rate/1200,S.tenure*12,loan),minIncome=emi*12/.4;
  const grossYield=S.rent*12/allin,netYield=(S.rent*12*.8-S.super*12*12)/allin;
  const L=new Date(P.launch),Pd=new Date(S.possession);
  const elapsed=mb(L,TODAY),toPoss=mb(TODAY,Pd),possMonth=mb(L,Pd);
  const phases=[["Launch",0,3],["Post-launch",3,12],["Sustenance",12,40],["Near possession",40,60],["Possession",60,999]];
  let ph=phases.findIndex(p=>elapsed>p[1]&&elapsed<=p[2]);if(ph<0)ph=0;if(toPoss<=0)ph=4;
  const routeA=preHand<=60,routeB=S.bsp<=S.rtm,t1=(routeA||routeB)?"PASS":"FAIL";
  const condA=S.bsp<=S.newLaunch,condB=preHand<=60,t3=!condA?"FAIL":(condB?"PASS":"CONDITIONAL");
  const t2=t1==="FAIL"?"CONDITIONAL":"PASS";
  return{base,other,sub,gst,stamp,allin,preHand,loan,emi,minIncome,grossYield,netYield,elapsed,toPoss,possMonth,ph,phase:phases[ph],phases,routeA,routeB,t1,condA,condB,t3,t2,t4:"UNTESTED",rateCarpet:allin/(S.super*.62)};
}
const SCORE={
  hood:[["Peak commute to Cyber City",3,3,"40–55 min at 9am"],["Airport access",3,5,"IGI ~15–20 min"],["Schools & admission ease",3,3,"Few established yet"],["Hospitals within 20 min",2,3.5,"Dwarka & Gurugram"],["Daily-needs retail",2,2.5,"Mostly planned"],["1-yr price movement",2,4,"~18% YoY reported"],["Metro transit",2,2,"Proposed only"],["Air quality / flooding",2,2,"NCR baseline"]],
  proj:[["Brand & operator",3,4.5,"Westin; contract to verify"],["Developer delivery record",3,3,"Regional; record not supplied"],["Amenities & clubhouse",2,4.5,"Size unverified"],["Density",2,3,"20–71 units/acre"],["Open & green space",2,4,"~80% claimed"],["Legal & RERA currency",2,4,"4 registrations live"],["Payment-plan flexibility",2,2,"30:40:30 CLP"]]
};
const bscore=rows=>{let s=0,w=0;rows.forEach(r=>{s+=r[2]/5*10*r[1];w+=r[1]});return s/w};

/* ============================ SHELL ============================ */
const TABS=[["overview","Overview"],["fit","Fit check"],["project","Project"],["cost","True cost"],["timing","Timing & tests"],["buyers","Buyers"],["playbook","Playbook"]];
let analysed=false,cur="upload",srcName="";
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab-btn${cur===t[0]?" active":""}" data-t="${t[0]}"${analysed?"":" disabled"}>${t[1]}</button>`).join("");
  document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t){cur=t;try{localStorage.setItem("fixit-tab",t)}catch(e){}renderTabs();render();window.scrollTo({top:0})}
function render(){
  const m=$("#main");
  if(cur==="upload"){m.innerHTML=vUpload();bindUpload();return}
  const c=compute();
  const V={overview:vOverview,fit:vFit,project:vProject,cost:vCost,timing:vTiming,buyers:vBuyers,playbook:vPlaybook};
  m.innerHTML=`<div class="view show">${V[cur](c)}${foot()}</div>`;
  bind(c);
}
function foot(){return `<div class="foot"><b>Source:</b> ${srcName} · analysed against HARERA registrations and public listings (megarealtymax.com, 100acress.com, realtyhunting.com, whiteland.co.in, propertypistol.com, 99acres.com). Figures are tagged <b>Brochure</b>, <b>Computed</b>, <b>Researched</b>, <b>Directional</b> or <b>Verify</b>. Third-party figures are reported, not verified. Check every figure with the developer before any purchase decision.</div>`}

/* ============================ UPLOAD ============================ */
const PASSES=[
  ["Intake & completeness","Checking blocking fields: name, developer, sector, RERA, acreage, units, possession, launch date, payment plan","14 / 22 fields"],
  ["Extraction","38 facts · 3 & 4 BHK, from ₹7 Cr, RERA 65/66/67 of 2024 and 52 of 2025, clubhouse, amenities","38 facts"],
  ["Verification","Cross-checking HARERA + 9 listings · possession disagrees across 3 sources, units 412–1,500, towers 5 vs 13","6 conflicts"],
  ["Lifecycle placement","Launch basis: RERA registration 18 Jun 2024 · months elapsed → sales phase","phase set"],
  ["Buyer-case tests","Investor exit · brand & location pull · first-home buyer · past-buyer cross-sell","4 tests"],
  ["Computation","All-in cost, EMI, income required, yield, density","live model"],
  ["Synthesis","Personas, catchment, demand, priorities, content themes","7 views"]
];
function vUpload(){
  return `<div class="view show">${phead("Analyse a project","Upload a project brochure. Fixit extracts every fact, checks it against RERA and public listings, runs the numbers and tells you who the project is really for.")}
  <div class="upgrid">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel">
        <label class="drop" id="drop" for="file">
          <span class="dico">${ic("up","")}</span>
          <h3>Drop a brochure here</h3>
          <p>PDF, image or Word file, up to 50 MB. Floor plans and a cost sheet sharpen the result.</p>
          <span class="btnrow"><span class="btn dark">Choose file</span></span>
          <span class="btnrow">${["PDF","JPG / PNG","DOCX","PPTX"].map(x=>chip(x,"")).join("")}</span>
          <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.ppt,.pptx" hidden>
        </label>
      </div>
      <button class="samplecard" type="button" id="sampleBtn">
        <div class="cover" aria-hidden="true"><span class="c1">SECTOR 103 · GURUGRAM</span><span class="c2">THE WESTIN<br>RESIDENCES</span><span class="c3">3 &amp; 4 BHK · BRANDED LIVING</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><span class="crumb">SAMPLE BROCHURE</span><span style="font-weight:700;font-size:15px">The Westin Residences</span><span style="font-size:12.5px;color:var(--muted)">Branded residences on Dwarka Expressway. A good example: the brochure is short on facts, and public records disagree with it in six places.</span><span class="xlink" style="align-self:flex-start;margin-top:4px">Analyse sample →</span></div>
      </button>
    </div>
    <div class="panel" id="runPanel">
      <div id="fileSlot"><div class="empty"><span class="ei">${ic("doc","")}</span><b style="color:var(--ink)">Waiting for a document</b>These seven passes run on every brochure.</div></div>
      <div class="prog" id="prog"><div></div></div>
      <div class="steps">${PASSES.map((p,i)=>`<div class="stp idle" id="ps${i}"><span class="n">${i+1}</span><div><div class="t">${p[0]}</div><div class="d"></div></div><span class="o"></span></div>`).join("")}</div>
    </div>
  </div></div>`;
}

let timer=null;
function bindUpload(){
  const drop=$("#drop"),file=$("#file");
  file.onchange=()=>{if(file.files[0])run(file.files[0])};
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)run(f)});
  $("#sampleBtn").onclick=ev=>{ev.preventDefault();run({name:"Westin_Residences_Brochure.pdf",size:6.8e6})};
}

function run(f){
  srcName=f.name;$("#meta").textContent=f.name;
  const ext=(f.name.split(".").pop()||"doc").toUpperCase().slice(0,4);
  const mbs=f.size?(f.size/1e6).toFixed(1)+" MB":"";
  $("#fileSlot").innerHTML=`<div class="filecard"><span class="fi">${ext}</span><div style="min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name.replace(/[<>&]/g,"")}</div><div style="font:11px var(--mono);color:var(--faint)">${mbs} · uploaded just now</div></div></div>`;
  document.querySelectorAll(".stp").forEach(x=>x.classList.remove("idle"));
  clearTimeout(timer);let i=0;
  const step=()=>{
    $("#prog div").style.width=(i/PASSES.length*100)+"%";
    if(i>0){const d=$("#ps"+(i-1));d.classList.remove("active");d.classList.add("done");d.querySelector(".n").textContent="✓";d.querySelector(".o").textContent=PASSES[i-1][2]}
    if(i>=PASSES.length){timer=setTimeout(()=>{analysed=true;go("overview")},450);return}
    const el=$("#ps"+i);el.classList.add("active");
    const d=el.querySelector(".d"),t=PASSES[i][1];let k=0;const ty=setInterval(()=>{k+=3;d.textContent=t.slice(0,k);if(k>=t.length)clearInterval(ty)},10);
    i++;timer=setTimeout(step,950);
  };
  step();
}

/* ============================ OVERVIEW ============================ */
function meter(label,val,thr,max,fmt){const bad=val>thr;return `<div class="meter"><div class="ml"><span>${label}</span><b style="color:var(--${bad?"red":"green"})">${fmt(val)}</b></div><div class="mt"><div class="mf ${bad?"r":"g"}" style="width:${Math.min(100,val/max*100)}%"></div><i style="left:${thr/max*100}%"></i></div><div class="ms">limit ${fmt(thr)}</div></div>`}
function vCard(n,t,v,d,mv,extra){const k={PASS:"green",FAIL:"red",CONDITIONAL:"amber",UNTESTED:"muted"}[v];return `<div class="vcard ${k}"><div class="vk"><span>${n}</span>${chip(v)}</div><h3>${t}</h3><p>${d}</p>${extra||""}<div class="mv">${mv}</div></div>`}
function scoreRing(v){const r=34,C=2*Math.PI*r,f=C*v/10;return `<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Score ${v.toFixed(1)} of 10"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--fill2)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${f} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="600" fill="var(--ink)">${v.toFixed(1)}</text></svg>`}
function priceChart(){
  const rows=[["Sector 103 ready stock",S.rtm,"Resale and ready-to-move homes in Sectors 102–106"],["Recent corridor launches",S.newLaunch,"New launches on Dwarka Expressway, last ~6 months"],["Westin Residences",S.bsp,"Implied from ~₹7 Cr on ~2,900 sq ft","you"],["Golf Course Road (entry)",25000,"Lower end of the ₹25–45k premium band"]];
  const max=Math.max(...rows.map(r=>r[1]))*1.05;
  return `<div class="chart-h"><div><div class="ct">Price position</div><div class="cs">₹ per sq ft · the investor exit needs Westin at or below ready stock</div></div>${chip("Researched","")}</div>
  ${rows.map(r=>`<div class="pbar ${r[3]||""}" data-tip="<b>${r[0]}</b><br>${inr(r[1])}/sq ft<br>${r[2]}"><span class="bl">${r[0]}</span><div class="btrack"><div class="bfill" style="width:${r[1]/max*100}%"></div></div><span class="bv">₹${(r[1]/1000).toFixed(1)}k</span></div>`).join("")}
  <div style="font-size:12px;color:var(--muted);margin-top:10px">Westin is <b style="color:var(--ink)">+${Math.round((S.bsp/S.rtm-1)*100)}%</b> over ready stock and <b style="color:var(--ink)">+${Math.round((S.bsp/S.newLaunch-1)*100)}%</b> over recent launches.</div>`;
}
function cashChart(c){
  const W=560,H=210,L=40,R=12,T=14,B=30,T0=Math.max(1,c.toPoss),Tm=Math.ceil(T0+4);
  const X=m=>L+(W-L-R)*m/Tm,Y=p=>T+(H-T-B)*(1-p/100);
  const pts=[[0,0],[0,S.slab1],[T0,S.slab1+S.slab2],[T0,100],[Tm,100]];
  const path=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  let g="";
  [0,25,50,75,100].forEach(p=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(p)+4}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${p}%</text>`});
  for(let m=0;m<=Tm;m+=12)g+=`<text x="${X(m)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${m===0?"today":"+"+m+"m"}</text>`;
  g+=`<path d="${path} L ${X(Tm)} ${Y(0)} L ${X(0)} ${Y(0)} Z" fill="var(--blue-soft)"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(60)}" y2="${Y(60)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+8}" y="${Y(60)-6}" text-anchor="start" font-size="10.5" font-weight="600" fill="var(--red)">60% ceiling for investors &amp; renters</text>`;
  g+=`<line x1="${X(T0)}" x2="${X(T0)}" y1="${T}" y2="${Y(0)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${X(T0)-6}" y="${T+10}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--green)">keys</text>`;
  g+=`<circle id="cashDot" r="5" fill="var(--blue)" stroke="var(--panel)" stroke-width="2" style="display:none"/><rect id="cashHit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  return `<div class="chart-h"><div><div class="ct">When your money goes out</div><div class="cs">Cumulative share of the ${cr(c.allin)} all-in, for a buyer booking today</div></div>${chip(c.preHand+"% before keys","r")}</div>
  <div class="chart"><svg id="cashSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative payment schedule" data-t0="${T0}" data-tm="${Tm}" data-w="${W}" data-l="${L}" data-r="${R}" data-t="${T}" data-h="${H}" data-b="${B}">${g}</svg></div>`;
}
function vOverview(c){
  const h=bscore(SCORE.hood),p=bscore(SCORE.proj),comp=(h*45+p*35)/80;
  const over=Math.round((S.bsp/S.rtm-1)*100);
  return `<div class="panel hero">
    <div class="hl">
      <span class="crumb">PROJECTS / GURUGRAM / SECTOR 103</span>
      <div><h1>${P.name}</h1><div class="loc" style="margin-top:6px">${P.loc} · ${P.dev}</div></div>
      <div class="chips">${chip("Westin · Marriott","v")}${chip("3 & 4 BHK","")}${chip("4 RERA registrations","g")}${chip("Possession 2028–31 · verify","a")}${chip(c.phase[0]+" · month "+Math.round(c.elapsed),"b")}</div>
      <p class="verdict"><b>A branded home for affluent end users and NRIs with NCR roots. A weak bet for flip investors.</b> The Westin name carries real long-distance pull. At ${inr(S.bsp)}/sq ft with ${c.preHand}% due before handover, there's no quick investor exit and no case for a first home. Local demand has been worked. The live audience is out-of-state and overseas.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark" data-go="fit">Check if it fits you →</button><button class="btn" data-go="cost">See the true cost</button></div>
    </div>
    <div class="hr">
      <div class="ring">${scoreRing(comp)}<div class="rt"><b>Fixit score</b><span>out of 10, on the 80% of weight assessed. Floor plans add the rest.</span></div></div>
      <div class="subbars">
        ${[["Neighbourhood",h,"45%"],["Project",p,"35%"]].map(x=>`<div class="brow" data-tip="<b>${x[0]}</b> · weight ${x[2]}<br>${x[1].toFixed(1)} / 10"><span class="bl">${x[0]}</span><div class="btrack"><div class="bfill" style="width:${x[1]*10}%"></div></div><span class="bv">${x[1].toFixed(1)}</span></div>`).join("")}

function fitHTML(c){
  const R=[];let s=70;const add=(k,t,d)=>{R.push([k,t]);s+=d};
  const need4=F.parents==="yes"||F.house==="6",cfg=need4?"4BHK":"3BHK",cf=CONFIGS[cfg];
  const allin=cf.super*S.bsp*(1+S.other/100)*(1+(S.gst+S.stamp)/100),emi=pmt(S.rate/1200,S.tenure*12,cf.super*S.bsp*.75);
  add("c",`<b>Recommended: ${cfg.replace("BHK"," BHK")}.</b> ${need4?"Parents or 5+ people need the fourth bedroom.":"A 3 BHK covers your household."} All-in about ${cr(allin)}.`,0);
  const budget=+F.budget*1e7,income=+F.income*1e5;
  if(budget>=allin)add("y",`<b>Budget covers it</b> with ${cr(budget-allin)} to spare.`,8);
  else if(budget>=allin*.85)add("c",`<b>Budget is tight.</b> ${cr(allin-budget)} short of the all-in figure. Charges, GST and stamp duty add ~25% to the headline.`,-12);
  else add("n",`<b>Over budget by ${cr(allin-budget)}.</b> The real figure is ${cr(allin)}, not the ₹7 Cr headline.`,-35);
  if(income*.4/12>=emi)add("y",`<b>The EMI is affordable.</b> ${cr(emi)}/month is within 40% of your income.`,6);
  else add("c",`<b>The EMI stretches you.</b> ${cr(emi)}/month needs about ${cr(emi*12/.4)}/yr net. Put more down.`,-12);
  if(F.own==="rent")add("n",`<b>You'd pay rent and instalments together.</b> ${c.preHand}% is due before handover, over ${Math.max(0,Math.round(c.toPoss))} months.`,-15);
  if(F.move==="2"&&c.toPoss>24)add("n",`<b>Possession is too late.</b> The earliest public date is Dec 2028, the latest Sep 2031.`,-30);
  else if(F.move==="4"&&c.toPoss>48)add("c",`<b>Timing is uncertain.</b> The selected possession date is ${Math.round(c.toPoss)} months away. Get the RERA date in writing.`,-10);
  const p=F.purpose;
  if(p==="live")add("y",`<b>You're an end user,</b> which is what this project is priced for: Westin services, the clubhouse, airport access.`,8);
  if(p==="hold")add("c",`<b>A long hold is possible but slow.</b> You're betting on the branded premium and the corridor maturing.`,-5);
  if(p==="flip")add("n",`<b>Flipping fails the investor exit test.</b> ${c.preHand}% is paid before keys, and the price is ${Math.round((S.bsp/S.rtm-1)*100)}% above ready stock.`,-35);
  if(p==="rent")add("n",`<b>The rental yield is thin.</b> About ${(c.grossYield*100).toFixed(1)}% gross and ${(c.netYield*100).toFixed(1)}% net.`,-30);
  if(p==="first")add("n",`<b>It's priced above first-home options.</b> Recent launches are ~${inr(S.newLaunch)}/sq ft vs ${inr(S.bsp)} here.`,-30);
  if(F.nri==="yes")add("y",`<b>NRI with regional roots:</b> this phase's primary audience. Family can inspect for you. Check lender NRI policy.`,8);
  if(F.nri==="far")add("c",`<b>No local ties.</b> The brand does the work, but you can't check the site or progress yourself. Use a buyer's agent.`,-8);
  s=Math.max(3,Math.min(97,s));
  const v=s>=70?["Strong fit","green"]:s>=45?["Fit with conditions","amber"]:["Not a fit","red"];
  const r=52,C=2*Math.PI*r,len=C*.75,fill=len*s/100;
  return `<div class="panel gauge"><div class="subhead" style="margin:0">Fit score</div>
    <svg width="160" height="138" viewBox="0 0 150 130" role="img" aria-label="Fit score ${s}"><g transform="rotate(135 75 72)"><circle cx="75" cy="72" r="${r}" fill="none" stroke="var(--fill)" stroke-width="11" stroke-dasharray="${len} ${C}" stroke-linecap="round"/><circle cx="75" cy="72" r="${r}" fill="none" stroke="var(--${v[1]})" stroke-width="11" stroke-dasharray="${fill} ${C}" stroke-linecap="round"/></g><text x="75" y="83" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600" font-size="32" fill="var(--ink)">${s}</text></svg>
    <div class="v" style="color:var(--${v[1]})">${v[0]}</div><div style="font-size:11.5px;color:var(--faint)">out of 100</div></div>
  <div class="panel"><div class="subhead">Why</div><ul class="fitlist">${R.map(x=>`<li><span class="mk ${x[0]}">${x[0]==="y"?"✓":x[0]==="n"?"✕":"!"}</span><span>${x[1]}</span></li>`).join("")}</ul></div>`;
}

function waterfall(c){
  const steps=[["Base price",0,c.base,"bar"],["Other charges",c.base,c.other,"amber"],["GST",c.base+c.other,c.gst,"amber"],["Stamp + registry",c.sub+c.gst,c.stamp,"amber"],["All-in",0,c.allin,"blue"]];
  const W=560,H=230,L=12,R=12,T=26,B=34,max=c.allin*1.06,bw=(W-L-R)/steps.length;
  const Y=v=>T+(H-T-B)*(1-v/max);let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line2)"/>`;
  steps.forEach((s,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,y0=Y(s[1]+s[2]),y1=Y(s[1]);
    g+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(2,y1-y0)}" rx="4" fill="var(--${s[3]})" data-tip="<b>${s[0]}</b><br>${cr(s[2])}${i&&i<4?" · +"+(s[2]/c.base*100).toFixed(1)+"% of base":""}"/>`;
    if(i<steps.length-1){const nx=L+(i+1)*bw+bw*.18;g+=`<line x1="${x+w}" x2="${nx}" y1="${y0}" y2="${y0}" stroke="var(--faint)" stroke-dasharray="2 3"/>`}
    g+=`<text x="${x+w/2}" y="${y0-7}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">${i&&i<4?"+":""}${cr(s[2])}</text>`;
    g+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${s[0]}</text>`;});
  return `<div class="chart-h"><div><div class="ct">From headline to all-in</div><div class="cs">${S.cfg.replace("BHK"," BHK")} · charges, GST and stamp duty add ${((c.allin/c.base-1)*100).toFixed(0)}%</div></div>${chip("Computed","b")}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost build-up waterfall">${g}</svg></div>`;
}

    const g=$("#costGrid");if(g&&innerWidth<900)g.style.gridTemplateColumns="1fr";
  }
  if(cur==="timing"){$("#possSel").onchange=e=>{S.possession=e.target.value;render()}}
}
function tip(e,html){const t=$("#tip");t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;t.style.left=x+"px";t.style.top=y+"px"}
function untip(){$("#tip").hidden=true}
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)tip(e,el.dataset.tip);else if(!e.target.closest||!e.target.closest("#cashHit"))untip()});

$("#upBtn").onclick=()=>{analysed=false;cur="upload";$("#meta").textContent="No document";renderTabs();render()};

renderTabs();render();
</script>
</body>
</html>
